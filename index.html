<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#17151b" />
    <title>Moss &amp; der falsche Pfad</title>
    <link rel="stylesheet" href="style.css?v=20" />
  </head>
  <body>
    <main class="shell">
      <section id="gameWrap" class="game-wrap" aria-label="Moss und der falsche Pfad" tabindex="0">
        <canvas id="game" width="960" height="540" aria-label="Spielfeld"></canvas>
        <header class="hud" aria-live="polite">
          <div><span>RAUM</span><strong id="levelLabel">01 · ERWACHEN</strong></div>
          <div class="deaths"><span>VERSUCHE</span><strong id="deathLabel">0</strong></div>
        </header>
        <div id="toast" class="toast" role="status"></div>
        <div class="game-actions">
          <button id="levelsBtn" class="icon-btn" aria-label="Raumauswahl" title="Raumauswahl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z"/></svg></button>
          <button id="restartBtn" class="icon-btn" aria-label="Raum neu starten" title="Neu starten (R)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.7 7.3A9 9 0 1 0 21 13h-3a6 6 0 1 1-1.4-3.8L13 13h8V5z"/></svg></button>
          <button id="soundBtn" class="icon-btn" aria-label="Ton ausschalten" title="Ton (M)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zm12.5-1.5a6 6 0 0 1 0 9l-1.8-1.8a3.5 3.5 0 0 0 0-5.4z"/></svg></button>
        </div>
        <nav class="touch-controls" aria-label="Touch-Steuerung">
          <div class="move-controls"><button data-key="left" aria-label="Nach links"><svg viewBox="0 0 24 24"><path d="m14.8 5-7 7 7 7z"/></svg></button><button data-key="right" aria-label="Nach rechts"><svg viewBox="0 0 24 24"><path d="m9.2 5 7 7-7 7z"/></svg></button></div>
          <button data-key="jump" class="jump" aria-label="Springen"><svg viewBox="0 0 24 24"><path d="m5 14.8 7-7 7 7z"/></svg></button>
        </nav>
        <div id="levelScreen" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="levelTitle"><section class="panel level-panel"><div class="panel-head"><div><p>DEIN WEG</p><h1 id="levelTitle">Räume</h1></div><button id="closeLevelsBtn" class="icon-btn close" aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18"/></svg></button></div><div id="levelGrid" class="level-grid"></div></section></div>
        <div id="deathScreen" class="overlay hidden" role="dialog" aria-modal="true"><section class="panel compact-panel"><p>KNAPP DANEBEN</p><h1>Nochmal.</h1><button id="deathRestartBtn" class="primary">WEITER</button><button id="deathLevelsBtn" class="text-btn">RÄUME</button></section></div>
        <div id="winScreen" class="overlay hidden" role="dialog" aria-modal="true"><section class="panel compact-panel"><p>DER PFAD GIBT AUF</p><h1>Geschafft.</h1><strong id="finalStats"></strong><button id="againBtn" class="primary">NOCH EINMAL</button></section></div>
      </section>
    </main>
    <script src="game.js?v=20"></script>
  </body>
</html>
