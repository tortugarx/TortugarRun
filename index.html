<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071b22" />
    <title>Moss &amp; der falsche Pfad</title>
    <link rel="stylesheet" href="style.css?v=4" />
  </head>
  <body>
    <main class="shell">
      <section
        class="game-wrap"
        aria-label="Moss und der falsche Pfad Spielbereich"
      >
        <canvas id="game" width="960" height="540"></canvas>
        <div id="startScreen" class="overlay">
          <p class="eyebrow">LEVEL DEVIL</p>
          <h1>Trau nichts.</h1>
          <p>Bring die Schildkröte zur Tür.</p>
          <button id="startBtn" class="primary">SPIELEN</button>
          <button id="levelsBtn" class="secondary">LEVEL</button>
          <div class="key-row">
            <span><kbd>A</kbd><kbd>D</kbd> Laufen</span>
            <span><kbd>W</kbd> / <kbd>↑</kbd> Springen</span>
            <span><kbd>F</kbd> Fallen zeigen</span>
          </div>
        </div>
        <div id="winScreen" class="overlay hidden">
          <p class="eyebrow">GESCHAFFT</p>
          <h1>Das war's.</h1>
          <p id="finalStats"></p>
          <button id="againBtn" class="primary">NOCHMAL</button>
        </div>
        <div id="levelScreen" class="overlay hidden">
          <p class="eyebrow">LEVEL</p>
          <h2>Wähle einen Raum</h2>
          <div id="levelGrid" class="level-grid"></div>
          <button id="closeLevelsBtn" class="secondary">ZURÜCK</button>
        </div>
        <div class="hud">
          <div><small>RAUM</small><strong id="levelLabel">01 / 06</strong></div>
          <div class="focus-wrap">
            <small>FOKUS</small>
            <div class="meter"><i id="focusMeter"></i></div>
          </div>
          <div class="right">
            <small>FEHLTRITTE</small><strong id="deathLabel">00</strong>
          </div>
        </div>
        <div id="toast" class="toast"></div>
        <div class="game-actions">
          <button id="mapBtn" aria-label="Levelübersicht">▦</button>
          <button id="restartBtn" aria-label="Raum neu starten">↻</button>
          <button id="soundBtn" aria-label="Ton umschalten">♪</button>
        </div>
        <nav class="touch-controls" aria-label="Touch-Steuerung">
          <button data-key="left" aria-label="Links">←</button>
          <button data-key="right" aria-label="Rechts">→</button>
          <button data-key="jump" class="jump" aria-label="Springen">↑</button>
          <button data-key="focus" class="focus" aria-label="Fokus">!</button>
        </nav>
      </section>
    </main>
    <script src="game.js?v=4"></script>
  </body>
</html>
