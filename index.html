<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071b22" />
    <title>Level Devil</title>
    <link rel="stylesheet" href="style.css?v=8" />
  </head>
  <body>
    <main class="shell">
      <section class="game-wrap" aria-label="Level Devil game">
        <canvas id="game" width="960" height="540"></canvas>
        <div id="winScreen" class="overlay hidden">
          <p class="eyebrow">COMPLETE</p>
          <h1>You made it.</h1>
          <p id="finalStats"></p>
          <button id="againBtn" class="primary">PLAY AGAIN</button>
        </div>
        <div id="levelScreen" class="overlay hidden">
          <p class="eyebrow">LEVELS</p>
          <h2>Choose a room</h2>
          <div id="levelGrid" class="level-grid"></div>
          <button id="closeLevelsBtn" class="secondary">BACK</button>
        </div>
        <div class="hud">
          <div><small>ROOM</small><strong id="levelLabel">01 / 30</strong></div>
          <div class="focus-wrap">
            <small>FOKUS</small>
            <div class="meter"><i id="focusMeter"></i></div>
          </div>
          <div class="right">
            <small>DEATHS</small><strong id="deathLabel">00</strong>
          </div>
        </div>
        <div id="toast" class="toast"></div>
        <div class="game-actions">
          <button id="focusBtn" aria-label="Reveal spikes">!</button>
          <button id="mapBtn" aria-label="Level select">▦</button>
          <button id="restartBtn" aria-label="Restart room">↻</button>
          <button id="soundBtn" aria-label="Toggle sound">♪</button>
        </div>
        <nav class="touch-controls" aria-label="Touch controls">
          <button data-key="left" aria-label="Move left">←</button>
          <button data-key="right" aria-label="Move right">→</button>
          <button data-key="jump" class="jump" aria-label="Jump">↑</button>
        </nav>
      </section>
    </main>
    <script src="game.js?v=8"></script>
  </body>
</html>
