<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071b22" />
    <title>Tortuga Trials</title>
    <link rel="stylesheet" href="style.css?v=44" />
  </head>
  <body>
    <main class="shell">
      <section class="game-wrap" aria-label="Tortuga Trials game">
        <canvas id="game" width="960" height="540"></canvas>
        <aside id="tutorialCard" class="tutorial-card hidden" aria-label="Tutorial">
          <strong>HOW TO PLAY</strong>
          <div><i>1</i><b>← →</b><span>MOVE</span></div>
          <div><i>2</i><b>↑</b><span>JUMP</span></div>
          <div class="tutorial-goal"><i>3</i><b>→</b><span>REACH THE DOOR</span></div>
        </aside>
        <div id="winScreen" class="overlay hidden">
          <p class="eyebrow">COMPLETE</p>
          <h1>You made it.</h1>
          <p id="finalStats"></p>
          <button id="againBtn" class="primary">PLAY AGAIN</button>
        </div>
        <div id="levelScreen" class="overlay hidden">
          <div class="panel">
            <p class="eyebrow">LEVELS</p>
            <h2>Choose a room</h2>
            <div id="levelGrid" class="level-grid"></div>
            <button id="closeLevelsBtn" class="secondary">BACK</button>
          </div>
        </div>
        <div id="deathScreen" class="overlay hidden">
          <div class="panel death-panel">
            <p class="eyebrow">TRY AGAIN</p>
            <h2 id="deathMessage">Not this time.</h2>
            <div class="death-actions">
              <button id="deathRestartBtn" class="secondary">RESTART</button>
              <button id="deathLevelsBtn" class="secondary">LEVELS</button>
            </div>
          </div>
        </div>
        <div id="settingsScreen" class="overlay hidden">
          <div class="panel settings-panel">
            <p class="eyebrow">SETTINGS</p>
            <h2>Game options</h2>
            <button id="autoRestartSetting" class="setting-row">
              <span>AUTO RESTART</span
              ><strong id="autoRestartValue">OFF</strong>
            </button>
            <button id="soundSetting" class="setting-row">
              <span>SOUND</span><strong id="soundValue">ON</strong>
            </button>
            <button id="trackingSetting" class="setting-row">
              <span>TRACKING MODE</span><strong id="trackingValue">ON</strong>
            </button>
            <button id="aboutSetting" class="setting-row">
              <span>ABOUT</span><strong>OPEN</strong>
            </button>
            <button id="closeSettingsBtn" class="secondary">BACK</button>
          </div>
        </div>
        <div id="aboutScreen" class="overlay hidden">
          <div class="panel about-panel" role="dialog" aria-labelledby="aboutTitle" aria-modal="true">
            <p class="eyebrow">ABOUT</p>
            <h2 id="aboutTitle">TORTUGA TRIALS</h2>
            <div class="about-version">VERSION 1.0</div>
            <div class="about-credit">by StoiberRules</div>
            <button id="closeAboutBtn" class="secondary">BACK</button>
          </div>
        </div>
        <div id="sectionBanner" class="section-banner hidden" aria-live="polite">
          <small>NEW SECTION</small><strong></strong>
        </div>
        <div class="hud">
          <div><small>ROOM</small><strong id="levelLabel">01 / 50</strong></div>
          <div class="right">
            <small>DEATHS</small><strong id="deathLabel">00</strong>
          </div>
        </div>
        <div class="game-actions">
          <button id="mapBtn" aria-label="Level select" title="Choose a level"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 2h8v8H2V2zm12 0h8v8h-8V2zM2 14h8v8H2v-8zm12 0h8v8h-8v-8z"/></svg></button>
          <button id="restartBtn" aria-label="Restart room" title="Restart (R)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h4v3h10v3h3v9h-3v3H7v-4h9v-2h1v-5h-1V9H7v3H3V3zm-3 7h3v5H0v-5z"/></svg></button>
          <button id="settingsBtn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h8v4H2V4zm12 0h8v4h-8V4zm-4-2h4v8h-4V2zM2 16h3v4H2v-4zm7 0h13v4H9v-4zm-4-2h4v8H5v-8z"/></svg></button>
        </div>
        <nav class="touch-controls" aria-label="Touch controls">
          <button data-key="left" aria-label="Move left"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 1h3v3H6v3h9v3H6v3h3v3H6v-3H3v-3H0V7h3V4h3z"/></svg></button>
          <button data-key="right" aria-label="Move right"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 1h3v3h3v3h3v3h-3v3h-3v3H7v-3h3v-3H1V7h9V4H7z"/></svg></button>
          <button data-key="jump" class="jump" aria-label="Jump"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 0h4v3h3v3h3v3h-3V6h-3v10H6V6H3v3H0V6h3V3h3z"/></svg></button>
        </nav>
      </section>
    </main>
    <script src="levels.js?v=44"></script>
    <script src="world.js?v=44"></script>
    <script src="game.js?v=44"></script>
  </body>
</html>
